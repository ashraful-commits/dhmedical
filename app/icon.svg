<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1264E8" />
      <stop offset="100%" stop-color="#0F52BA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F52BA" flood-opacity="0.35" />
    </filter>
  </defs>

  {/* Smooth Rounded Squircle Background */}
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sapphireGrad)" filter="url(#glow)" />

  {/* Subtle Medical Cross Watermark */}
  <rect x="27" y="10" width="10" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.22" />
  <rect x="10" y="27" width="44" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22" />

  {/* High-Precision ECG / Lifeline Pulse */}
  <path
    d="M11 32h10l4.5-9 7.5 18 5.5-12 3.5 5h11"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  {/* Glowing Life Core Dot */}
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
</svg>
